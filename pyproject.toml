[project]
name = "bobs-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atlas", email = "67567432+Atlas4285@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
